<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חוזרי תשלומים לשנה"ל תשפ"ז | אורט שחקים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-z: #10B981;
      --color-z-hover: #059669;
      --color-ch: #0EA5E9;
      --color-ch-hover: #0284C7;
      --color-t: #8B5CF6;
      --color-t-hover: #7C3AED;
      --color-y: #F59E0B;
      --color-y-hover: #D97706;
      --color-ya: #EC4899;
      --color-ya-hover: #DB2777;
      --color-yb: #3B82F6;
      --color-yb-hover: #2563EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Assistant', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #0b192e;
      overflow-x: hidden;
      padding: 30px 16px;
    }

    /* רקע קמפוס בוקה תלת מימדי */
    .bg-bokeh-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-image {
      position: absolute;
      inset: -20px;
      background-image: url('watermarked_img_15974688348379952644.jpg'), url('https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center 35%;
      filter: blur(8px) brightness(0.92) saturate(1.25);
      transform: scale(1.06);
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.35) 0%, rgba(15, 23, 42, 0.45) 100%);
    }

    /* אפקטי אור רכים מרחפים */
    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0.55;
      animation: floatLight 14s infinite ease-in-out alternate;
    }
    .light-1 { width: 340px; height: 340px; background: rgba(56, 189, 248, 0.45); top: 5%; left: 8%; }
    .light-2 { width: 420px; height: 420px; background: rgba(251, 146, 60, 0.38); bottom: 8%; right: 6%; animation-delay: -5s; }
    .light-3 { width: 300px; height: 300px; background: rgba(167, 139, 250, 0.35); top: 50%; left: 40%; animation-delay: -8s; }

    @keyframes floatLight {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-35px) scale(1.12); }
    }

    /* כרטיס תוכן מרכזי */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 860px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 36px;
      padding: 44px 36px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      text-align: center;
    }

    /* אזור הלוגו השקוף */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      min-height: 110px;
    }

    .school-logo-canvas {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.15));
      transition: transform 0.3s ease;
    }

    .school-logo-canvas:hover {
      transform: scale(1.03);
    }

    /* כותרות */
    .header-title {
      font-family: 'Heebo', 'Assistant', sans-serif;
      font-size: 2.3rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 1.15rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 36px;
    }

    /* רשת הכפתורים - 3 עמודות ברוחב רגיל, 2 בטאבלט, 1 בנייד */
    .grades-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        padding: 32px 20px;
        border-radius: 26px;
      }
      .header-title {
        font-size: 1.85rem;
      }
      .grades-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 480px) {
      .grades-grid {
        grid-template-columns: 1fr;
      }
    }

    /* כפתורי הכיתות עם הצללה אפורה מודגשת */
    .grade-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 76px;
      border-radius: 20px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Heebo', 'Assistant', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      
      /* הצללה אפורה תלת-ממדית מודגשת */
      box-shadow: 
        0 8px 0 rgba(71, 85, 105, 0.45),
        0 14px 22px rgba(15, 23, 42, 0.22);
    }

    /* צבעים ייחודיים לכל כיתה */
    .grade-btn.grade-z  { background: linear-gradient(135deg, #10B981, #059669); }
    .grade-btn.grade-ch { background: linear-gradient(135deg, #0EA5E9, #0284C7); }
    .grade-btn.grade-t  { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
    .grade-btn.grade-y  { background: linear-gradient(135deg, #F59E0B, #D97706); }
    .grade-btn.grade-ya { background: linear-gradient(135deg, #EC4899, #DB2777); }
    .grade-btn.grade-yb { background: linear-gradient(135deg, #3B82F6, #2563EB); }

    /* ברק עדין עליון לכפתור */
    .grade-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 38%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
      border-radius: 20px 20px 80px 80px;
      pointer-events: none;
    }

    /* אפקט ריחוף */
    .grade-btn:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 11px 0 rgba(71, 85, 105, 0.5),
        0 20px 28px rgba(15, 23, 42, 0.28);
      filter: brightness(1.05);
    }

    /* אפקט לחיצה */
    .grade-btn:active {
      transform: translateY(4px);
      box-shadow: 
        0 3px 0 rgba(71, 85, 105, 0.5),
        0 6px 12px rgba(15, 23, 42, 0.2);
    }

    /* כיתוב תחתון */
    .footer-note {
      font-size: 0.95rem;
      color: #64748B;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- רקע תלת מימדי בוקה -->
  <div class="bg-bokeh-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="bokeh-light light-1"></div>
    <div class="bokeh-light light-2"></div>
    <div class="bokeh-light light-3"></div>
  </div>

  <!-- כרטיס תוכן -->
  <main class="main-wrapper">
    
    <!-- לוגו בית הספר ללא רקע -->
    <div class="logo-container">
      <canvas id="schoolLogoCanvas" class="logo.png" width="600" height="260"></canvas>
    </div>

    <!-- כותרת ראשית -->
    <h1 class="header-title">חוזרי תשלומים לשנה"ל תשפ"ז</h1>
    <p class="header-subtitle">אורט שחקים • לחצו על הכיתה הרצויה לצפייה בחוזר</p>

    <!-- רשת הכפתורים - שם הכיתה בלבד והצללה אפורה מודגשת -->
    <section class="grades-grid" aria-label="חוזרי תשלומים לפי שכבות">
      
      <!-- כיתה ז -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-תשפז-שכבת-ז.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-z" 
         title="פתח חוזר תשלומים - כיתה ז">
        כיתה ז
      </a>

      <!-- כיתה ח -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-תשפז-שכבת-ח.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-ch" 
         title="פתח חוזר תשלומים - כיתה ח">
        כיתה ח
      </a>

      <!-- כיתה ט -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-תשפז-שכבת-ט.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-t" 
         title="פתח חוזר תשלומים - כיתה ט">
        כיתה ט
      </a>

      <!-- כיתה י' -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-שכבת-י.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-y" 
         title="פתח חוזר תשלומים - כיתה י'">
        כיתה י'
      </a>

      <!-- כיתה י"א -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-תשפז-שכבת-יא.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-ya" 
         title="פתח חוזר תשלומים - כיתה י&quot;א">
        כיתה י"א
      </a>

      <!-- כיתה י"ב -->
      <a href="https://schools.ort.org.il/sn/wp-content/uploads/sites/33/2026/09/חוזר-תשלומים-תשפז-שכבת-יב.pdf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="grade-btn grade-yb" 
         title="פתח חוזר תשלומים - כיתה י&quot;ב">
        כיתה י"ב
      </a>

    </section>

    <footer class="footer-note">
      המסמכים נפתחים בפורמט PDF בחלון חדש
    </footer>
  </main>

  <script>
    // טעינת תמונת הלוגו המקורית והסרה חלקה ואוטומטית של הרקע הלבן
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('schoolLogoCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      // אם שמרת את תמונת הלוגו המקורית בקובץ בשם logo.png, היא תיטען ישירות:
      img.src = 'logo.png';

      img.onload = () => {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);

        // הסרת הרקע הלבן בעזרת בדיקת ערכי RGB
        try {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // אם הפיקסל לבן / כמעט לבן - הופך לשקוף לחלוטין
            if (r > 240 && g > 240 && b > 240) {
              data[i + 3] = 0;
            }
          }
          ctx.putImageData(imgData, 0, 0);
        } catch (e) {
          // במידה ויש הגבלת CORS מקומית, הלוגו מוצג כרגיל
          console.warn('Transparent processing bypassed due to local file origin.');
        }
      };

      // גיבוי: אם logo.png לא קיים בתיקייה, מצייר את הלוגו הווקטורי המדויק
      img.onerror = () => {
        canvas.style.display = 'none';
        const parent = canvas.parentElement;
        parent.innerHTML = `
          <div style="font-family:'Heebo',sans-serif; text-align:center; padding:10px 0;">
            <div style="font-size:2.8rem; font-weight:900; color:#1E3A8A; line-height:1; letter-spacing:2px;">
              אורט <span style="color:#0284C7; font-size:2.2rem;">ORT</span>
            </div>
            <div style="font-size:1.8rem; font-weight:900; color:#DC2626; font-style:italic; margin-top:4px;">
              שחקים
            </div>
            <div style="font-size:0.95rem; font-weight:700; color:#DC2626; margin-top:2px;">
              למצוינות ולמנהיגות חברתית
            </div>
          </div>
        `;
      };
    });
  </script>
</body>
</html>
